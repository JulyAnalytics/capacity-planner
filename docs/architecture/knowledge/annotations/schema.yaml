# schema.yaml — per-store / per-field annotations joined into SCHEMA_REFERENCE.md
# Format: flat dotted keys (valid YAML). Top-level key = store (must match DB.STORES).
#   store._store:        one-line store description (store-level note)
#   store.field:         field-level note
#   store._<name>:       store-level meta note (e.g. dead code) — not field-checked
# Field sets are NOT structurally declared in source (deferred); only top-level
# store keys are orphan-checked against DB.STORES.

calendar._store: Weekly capacity calendar (day-type assignments per week).
calendar.year: accepts string|number — mixed prod data (legacy writes).
calendar.week: accepts string|number — mixed prod data (legacy writes).

priorities._store: DEPRECATED — superseded by monthlyPlans. Retained for read-back of legacy rows.
priorities._savePriority: dead code — savePriority() is unreachable; do not revive, migrate callers to monthlyPlans.
priorities.period: legacy alias for periodType.

subFocuses._store: Sub-focuses grouped under a focus.
subFocuses.id: TWO coexisting id patterns — legacy `sf-<focus>-general` (migrationRunner) vs timestamp `<type>-<ts>-<rand>` (creationModal). Do not assume one shape.
subFocuses.icon: max 2 chars.

epics._store: Epics owned by a focus/sub-focus; parent of stories.
epics.attachments: array (default []); same pointer shape as stories.attachments, written by window.attachmentPanel. Storage key stays `{uid}/{entityId}/{attId}/{filename}` — entity ids are globally unique, so no type segment was needed and every pre-existing story key still resolves. A seeded candidate also carries its source `.md` here (the parser's `rawMd`, attached by dataPortability.importCycle, `seeded:true`).
epics.status: enum EPIC_STATUS — 'candidate' is the strategic pre-commitment state (the spec's EpicCandidate), deliberately a status and not a separate store (ADR-0011). Candidates are excluded from hierarchyCache.getEpicsForSubFocus + the story panel's epic picker, are invisible in the backlog until they have stories, and never auto-complete. All epic writes go through window.epicWrites.
epics.wsjf: object {uv, tc, rr, duration} — the Ritual 3.1 inputs. LINEAGE: epics imported before 2026-07-28 have NO recoverable inputs — scripts/parseCandidates._wsjfFromTable kept only the composite total, so their vision reads "WSJF 25 · Size L · Rank 1" and the components are gone (infinitely many inputs give any total). migrateEpicsToStructuredScoring recovers problem/outcome/roughSize for those rows but deliberately leaves wsjf unset rather than storing an underived, hand-computed total; they re-score on the next import. The parser now emits components and the vision line shows the DERIVED score. The SCORE is never stored; wsjfScore() derives it, and priority rank is derived by sorting on that. A stored rank would be destroyed by the next cycle's re-scoring, and the imported text's stated score is unreliable (candidate_02 records 25 for (8+9+7)÷1 = 24). Absent/partial = unscored, rendered '—', not 0.
epics.businessCase: object {problem, outcome, timeEstimate, goNoGo, measurement} — the MVP spec's 5-field Epic Business Case. Completeness is the promotion gate out of 'candidate' (canPromoteEpic); the whitelist alone cannot express it because canTransitionStatus takes no record.
epics.roughSize: 'S'|'M'|'L'|'XL' — the candidate-stage T-shirt estimate, distinct from story.weight (which is the capacity-bearing number). Directional only; nothing sums it.
epics.generationSource: enum GENERATION_SOURCE 'brainstorm'|'backlog'|'parked' — provenance of a candidate; 'parked' means carried forward from a previous cycle's below-the-line set.
epics.themeId: id of a theme in the epic's OWN focus (focus.themes[]) — the spec's candidate→theme traceability. Set from the epic panel's theme picker; the picker only offers themes belonging to epic.focusId, so an epic can never point at another focus's theme.
epics.killReason: rationale captured when a candidate is archived. The spec kills "with rationale, not deleted" so the next cycle's brainstorm can see why. Surfaced on the epic panel only while status is archived.
epics.plannedSprintId: sprint the roadmap sequenced this epic into, written by strategyWrites.approveRoadmap through the epic spine. Contract when it lands: the sprint the roadmap sequenced this epic into. Epic-level planning INTENT only — sprintId itself lives on stories, and a freshly promoted epic has none, so approving a roadmap writes here and story creation prefills from it. Never read by capacity math.
epics.horizon: enum HORIZON 'now'|'next'|'later'|'never' (constants.js); ABSENT = unclassified. Backlog + story-map filter dimension; 'next'/'later' double as the strategic parked queue (a parked candidate carries to the next cycle by horizon, not a separate flag). Seeded from status by migrateEpicsToIncludeHorizon (active→now, planning→next; completed/archived left unset). NEW epics default to 'later' at both creation sites (creationModal.getFormData, dataPortability.mergeImport) per the MVP spec's standing rule "New ideas enter Later or Never first. Nothing enters Now without deliberate promotion." Without that default they landed unset and were invisible to every horizon filter — which is what happened to the epics created after the one-time migration stamped its guard.

stories._store: Stories (backlog items) owned by an epic; the write-spine store (see ADR-0006). Effort lives in `weight` alone (ADR-0009).
stories.id: created via creationModal generic `${type}-${Date.now()}-${rand}`.
stories.focus: denormalized from epic (legacy); prefer epic.focusId.
stories.epicId: DB CHECK NOT NULL — a story must pin an epic.
stories.sortOrder: sprint-scoped rank; seeded by migrateStoriesToIncludeSortOrder.
stories.cellSortOrder: per-cell (epic×sprint) rank in the story map; sibling of sortOrder.
stories.actionItems: array; seeded by migrateStoriesToIncludeActionItems.
stories.weight: the single effort field (ADR-0009) — S/M/L/XL entered, stored as 0.5|1|2|3 blocks; re-weighted from legacy estimatedBlocks by migrateStoriesToSizeWeight. Every capacity read (tier check, allocation, calendar bars) sums this.
stories.estimatedBlocks: DEPRECATED (ADR-0009) — legacy user estimate; read only for variance on completion of pre-migration records. Nothing writes it; new records store null.
stories.fibonacciSize: DEPRECATED (ADR-0009) — legacy 7-point scale, display-only history. FIBONACCI_SIZES retained solely so old imports validate. New records store null.
stories.inFocus: DEAD (2026-07-27) — the star mechanism it fed was removed (design-review pass 1 A7; true on 0 of 154 prod records). The Today view lists sprint stories directly.
stories.timeSpent: blocks summed from dailyLogs[].stories entries; live again — the Today view's done-ticks write {storyId, blocks} per day (pass 1 A7).
stories.reviewState: enum 'proposed'|'approved'|'discarded'; ABSENT = approved (legacy + modal-created rows). Set 'proposed' by candidate import (Stage 4 mergeImport); Inbox (Stage 5) sets 'approved' on save, 'discarded' on discard. Existing rows seeded 'approved' by migrateStoriesToIncludeReviewState.
stories.attachments: array (default []); items {id 'att-…', filename, storageKey '{uid}/{storyId}/{attId}/{filename}', size, type ATTACHMENT_TYPES, version ≥1, createdAt}. Content lives in private Storage bucket capacity-planner-docs (RLS user-scoped); records here are pointers only. Seeded by migrateStoriesToIncludeAttachments.
stories.sourceRef: string|null — provenance of imported/historical stories: spec filename or git commit hash (importHistoryManifest), or a triage/adapter native_ref e.g. `claude-fs://…` (js/triageQueue.js attach/create paths). Null for app-created rows (seeded by migrateStoriesToIncludeSourceRef).
stories.auditedAt: ISO|null + stories.auditSource: 'sprint-audit'|null (F4, 2026-08-05) — backdate provenance. The ONLY path that writes them is scripts/auditSprint.mjs's apply snippet: a 'done' audit verdict writes { status:'completed', completed:true, completedAt:<doneDate> } through storyWrites.commitStoryUpdate (ADR-0006) plus auditedAt=now + auditSource='sprint-audit'. completedAt is not gated by canTransitionStatus, which is why the provenance fields exist — a backdated completion must be distinguishable from a same-day completeStory stamp. Absent on all rows until the first sprint audit runs; no migration.

dailyLogs._store: Per-day log entries keyed `log-<dateStr>`. Written by todayView (default surface) and dailyLogOverlay (past days; flushes only when dirty — F1).
dailyLogs.stories: array of {storyId, blocks} actuals written by the Today view's done-ticks — the utilized/efficiency feed for analytics and storyLifecycle.getStoryTimeSpent.
dailyLogs.actualCapacity: auto-set to plannedCapacity on first write of the day (F8 — 51 of 74 legacy overrides were the user re-typing the derived value); Adjust reveals the input.

metadata._store: localStorage-only key/value store (not synced to Supabase); holds migration guards + misc.

monthlyPlans._store: Monthly epic-priority plans keyed `plan-<year>-<MM>`; successor to priorities.

focuses._store: Top-level focus areas (Priority Level → Focus → …).
focuses.attachments: array (default []); same pointer shape as stories.attachments, written by window.attachmentPanel. This is where a cycle's per-focus brain dump lands.

sprints._store: Sprints; status enum SPRINT_STATUS. Bare `crypto.randomUUID()` id.

travelSegments._store: DEPRECATED (ADR-0008) — superseded by locationPeriods as the single capacity-supply model. Store retained for export/import back-compat; no write path or editor remains.

locationPeriods._store: Location-bound capacity periods, id `loc-<uuid>`.

dayTypeOverrides._store: Per-day capacity overrides, feed sprint capacity headers.

cycles._store: Strategic cycles (~12 weeks) — the tier above the sprint lattice. Membership is DERIVED from date overlap, never a foreign key: no sprint/epic/story carries a cycleId (ADR-0012). Written only by window.strategyWrites, which also owns the synchronous cache calendarView renders the cycle band from.
cycles.status: 'planning'|'active'|'closed'. Closed is terminal and locks the dates — re-dating a closed cycle would retroactively rewrite which sprints belonged to it.
cycles.focuses: embedded array of FocusThesis records {focusId, rank, targetPct, classification, strategicRole, thesis, endState, nonGoals, themeIds[], status}. classification is FOCUS_CLASSIFICATION (active-strategic|active-maintenance|dormant); the spec caps active-strategic at MAX_ACTIVE_STRATEGIC=5, enforced as a coherence flag not a hard gate. Editable in the cycle detail panel (classification select + target input) via saveFocusThesis. Embedded, not a store — the monthlyPlans[].epics[] precedent; a focus thesis has no lifecycle outside its cycle.
cycles.closedSnapshot: {sprintIds[], epicIds[], focusActualPct{}, closedAt} — written once at close. Derivation answers for open cycles; this answers for closed ones. See ADR-0012.
cycles.killCriterion: the cycle-level go/no-go — dated, binary, observable. Surfaced on Today as its date approaches.
cycles.attachments: array (default []); markdown attachments via window.attachmentPanel (the cycle is an attachable owner there, writing through strategyWrites.commitCycleField). Holds both the cycle free-write .md and — when the cycle was seeded by dataPortability.importCycle — the source `01_cycle_thesis.md` prose it was parsed from. Seeded attachments carry `seeded:true` to distinguish them from manually-attached files; re-import dedups by filename (use the panel's replace to update a changed file).

strategicSessions._store: One record per planning run that produced a cycle. Written only by window.strategyWrites.
strategicSessions.kind: 'full'|'recut'|'backfill'. 'recut' is a mid-cycle re-score carrying only the scoring/sequencing steps and referencing parentSessionId; 'backfill' is a session reconstructed from the Obsidian corpus by scripts/parseCycle.mjs, marked so the outcome funnel never claims in-app provenance for work predating the feature.
strategicSessions.proposedRoadmap: [{epicId, sprintId, order}] — sequencing output. NOT the live schedule: approval writes epic.plannedSprintId, and story.sprintId stays the only thing capacity math reads. See ADR-0013.
focuses._theme_priority: theme.priorityWithinFocus (spec field) orders themes within a focus; set from the Strategy tab's theme portfolio via strategyView.themePriority → strategyWrites.commitTheme, unset sorts last.
strategicSessions.rankSnapshot: on a kind:'recut' session — [{id,name,score}] candidate ranking captured at the moment of re-cut, so Session history shows how prioritisation moved over the cycle rather than an empty marker. Only re-cuts carry it.
strategicSessions.ledger: frozen at commit — [{candidateId, epicId, focusId, wsjf, sprintSlot, targetPct}]. Makes 'what did I commit to' answerable after later re-scoring.

cycles.import-format: the JSON scripts/parseCycle.mjs emits and dataPortability.importCycle ingests. version 'cycle-1' carried structured fields only (cycle, weighting, focuses[].themes/candidates); version 'cycle-2' adds `rawMd` on the cycle, each focus (brain dump + focus thesis), and each candidate, so importCycle can attach the source prose to the created records (cycle → cycles.attachments, focus → focuses.attachments, candidate → its epic's epics.attachments). Both versions import — a missing rawMd means nothing to attach. Idempotent by (cycle name, startDate) for the cycle and by filename per entity for attachments; themes dedup by normalized name within their focus.

importQueue._store: Spec-triage handoff (migrations/20260719_import_queue.sql) — new Ashurbanipal Triage entries + the A-capacity-planner archive reconciliation land here for js/triageQueue.js to drain into attach/epic-match/create outcomes. Rows inserted by the Mini-side pipeline (service-role key, bypasses RLS) as well as read/updated by the browser session.
importQueue.status: enum 'pending'|'processed'|'failed' (F2, 2026-08-05). Never deleted on processing — status flip only, so the unique (user_id, contentHash) index keeps guarding against re-queuing an already-seen file. 'failed' is terminal for the drain: a row that fails FAILED_AFTER=3 consecutive drains (js/triageQueue.js) stops auto-retrying and surfaces in the Inbox's Stuck-imports section for explicit Retry ('pending' again with a clean slate) / Recreate (create branch direct, idempotent) / Dismiss ('processed' without writing). Failure bookkeeping lives on the row: failCount, lastError, failedAt — JSONB only, no migration.
importQueue.contentHash: sha256 of the source file's content; the dedup/idempotency key.
