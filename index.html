<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacity Planner</title>                                                                                                                                                                                                                                                                                                                                                                <link rel="stylesheet" href="dist/styles.97d1abc8.min.css">
  </head>
<body>
    <!-- Auth Overlay — shown when no session exists -->
    <div id="auth-overlay" style="display:none;">
      <div id="auth-box">
        <h2>Capacity Planner</h2>
        <p id="auth-message">Sign in to continue.</p>
        <input type="email" id="auth-email" placeholder="your@email.com" />
        <input type="password" id="auth-password" placeholder="Password" />
        <button id="auth-submit-btn" onclick="authSubmit()">Sign In</button>
        <p id="auth-status"></p>
      </div>
    </div>

    <!-- Floating Sidebar Navigation -->
    <nav id="floatingSidebar" class="floating-sidebar">
        <div class="sidebar-content">
            <div class="sidebar-header">
                <h4>Menu</h4>
                <button class="sidebar-toggle" onclick="app.toggleSidebar()">&#9664;</button>
            </div>
            <div class="sidebar-sections" id="sidebarSections"></div>
        </div>
    </nav>

    <!-- Expand button when sidebar is collapsed -->
    <button class="sidebar-expand-button" onclick="app.toggleSidebar()">&#9654;</button>

    <div class="container main-content">
        <header>
            <h1>Capacity Planner</h1>
            <div class="sync-status">
                <span id="lastSaved">Last saved: Never</span>
                <button id="exportBtn" class="btn-secondary btn-sm">Export</button>
                <button id="importBtn" class="btn-secondary btn-sm">Import</button>
                <button id="migrate-idb-btn" class="btn-tertiary btn-sm" onclick="migrateFromIDB()" title="Copy existing IndexedDB data to Supabase">Migrate Local Data</button>
                <button id="signout-btn" class="btn-tertiary btn-sm" onclick="authSignOut()" style="display:none;">Sign Out</button>
                <input type="file" id="fileInput" accept=".json" style="display:none">
            </div>
        </header>

        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="calendar">Calendar</button>
            <button class="nav-tab" data-tab="focus">Focus</button>
            <button class="nav-tab" data-tab="sprints">Sprints</button>
            <button class="nav-tab" data-tab="storymap">Story Map</button>
            <button class="nav-tab" data-tab="analytics">Analytics</button>
        </nav>

        <!-- Calendar tab — now the default view -->
        <div id="calendar" class="tab-content panel-expanded calendar-tab-readonly active">
            <div id="calendar-root"></div>
        </div>

        <!-- Analytics Tab -->
        <div id="analytics" class="tab-content panel-expanded">
            <div class="card" id="analyticsCard">
                <h2>Analytics</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="analyticsMonth">Month</label>
                        <select id="analyticsMonth">
                            <option value="01">January</option>
                            <option value="02">February</option>
                            <option value="03">March</option>
                            <option value="04">April</option>
                            <option value="05">May</option>
                            <option value="06">June</option>
                            <option value="07">July</option>
                            <option value="08">August</option>
                            <option value="09">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="analyticsWeek">Week</label>
                        <select id="analyticsWeek">
                            <option value="">Month Summary</option>
                            <option value="1">Week 1</option>
                            <option value="2">Week 2</option>
                            <option value="3">Week 3</option>
                            <option value="4">Week 4</option>
                            <option value="5">Week 5</option>
                        </select>
                    </div>
                </div>
                <button id="generateAnalytics" class="btn-primary">Generate Report</button>
                <div id="analyticsReport"></div>
            </div>
        </div>

        <!-- Tab 7: Backlog -->
        <div id="backlog" class="tab-content panel-expanded">
          <div id="backlog-root"></div>
        </div>

        <!-- Inbox — sidebar-only view (no nav-tab); rendered by inboxView.js -->
        <div id="inbox" class="tab-content panel-expanded"></div>

    </div>

    <!-- Backlog detail panel -->
    <div id="backlog-detail-panel" class="bdp-container" aria-hidden="true"></div>

    <!-- Floating Create Button -->
    <div class="global-actions">
      <button
        class="floating-create-btn"
        id="global-create-btn"
        onclick="openCreationModal()"
        title="Create new item (Cmd+K)"
      >+ Create</button>
    </div>

    <!-- Universal Item Modal — managed by ModalManager -->
    <div id="itemModalOverlay" class="modal-overlay" style="display:none" aria-modal="true" role="dialog">
      <div class="modal-container" id="itemModalContainer">
        <div class="modal-header" id="itemModalHeader">
          <!-- populated by ModalManager -->
        </div>
        <div class="modal-body" id="itemModalBody">
          <!-- populated by ModalManager -->
        </div>
        <div class="modal-footer" id="itemModalFooter">
          <!-- populated by ModalManager -->
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                                                                                                                                                                                                                                                                                                                                                        <script src="dist/app.6f605f46.min.js"></script>
  </body>
</html>
